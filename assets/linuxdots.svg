<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#6366f1;#8b5cf6;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#a855f7;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#a855f7;#6366f1;#c084fc" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="25%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="75%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
      <animate attributeName="x1" values="0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="400" y="105" font-family="ui-monospace, SFMono-Regular, monospace" font-size="64" font-weight="bold" fill="url(#g1)" text-anchor="middle" letter-spacing="5" opacity="0">
    linuxdots
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <text x="400" y="145" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16" fill="#9ca3af" text-anchor="middle" letter-spacing="2" opacity="0">
    ~ dotfiles for Omarchy
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>

  <text x="400" y="175" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="url(#g2)" text-anchor="middle" letter-spacing="3" opacity="0">
    <tspan>hyprland</tspan>
    <tspan fill="#4b5563" font-size="14"> | </tspan>
    <tspan>waybar</tspan>
    <tspan fill="#4b5563" font-size="14"> | </tspan>
    <tspan>ghostty</tspan>
    <tspan fill="#4b5563" font-size="14"> | </tspan>
    <tspan>nvim</tspan>
    <tspan fill="#4b5563" font-size="14"> | </tspan>
    <tspan>arch</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
  </text>

  <circle cx="220" cy="110" r="3" fill="#374151" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="110" r="3" fill="#374151" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
